<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="drizzle-kapak-baslik">
  <title id="drizzle-kapak-baslik">Drizzle algoritmasının şeması: kaba giriş pikselleri küçültülüp ince bir çıktı ızgarasına damlatılıyor</title>

  <!--
    DRIZZLE KAPAK GÖRSELİ.

    Neden çizim, neden fotoğraf değil: `features/articles/data.ts` kart
    görselinin "yazının ne hakkında olduğunu bir bakışta söylemesi"
    gerektiğini yazıyor. Rastgele bir bulutsu bu yazı için yalan olurdu —
    drizzle bir gökcismi değil, bir yeniden örnekleme yöntemi.

    Şema algoritmanın kendi metaforunu izliyor (yazının açılışı da öyle):
    giriş pikselleri küçültülür (pixfrac), her poz farklı bir alt piksel
    konumundan "damlar" ve damlalar ince çıktı ızgarasında birikir.
    Soldan sağa: kaba giriş ızgarası → düşen küçültülmüş damlalar → ince
    çıktı ızgarasında ortaya çıkan yıldız.

    SABİT KOYU ZEMİN, tema değişkeni DEĞİL. İki sebep: (1) dosya
    `public/` altından statik servis ediliyor, sayfanın CSS değişkenlerini
    göremez; (2) kart görselinin üstünde her iki temada da aynı kontrast
    kalsın — açık temada gri bir kutu olsaydı şerit dağılırdı. Aynı karar
    makale içindeki SVG'lerde de verildi (`dz-plate` değişkeni).
  -->

  <defs>
    <linearGradient id="dz-zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1114"/>
      <stop offset="0.55" stop-color="#0a0e11"/>
      <stop offset="1" stop-color="#07090b"/>
    </linearGradient>

    <radialGradient id="dz-yildiz" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9d2e" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ff9d2e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="dz-yildiz-kaba" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9d2e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="dz-iz" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="530">
      <stop offset="0" stop-color="#ff9d2e" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff9d2e" stop-opacity="0.42"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#dz-zemin)"/>

  <!-- Arka plan yıldız alanı: seyrek, sönük, düzensiz. Şemayı boğmasın. -->
  <g fill="#e6ebe8">
    <circle cx="118" cy="96" r="1.6" opacity="0.30"/>
    <circle cx="286" cy="52" r="1.1" opacity="0.20"/>
    <circle cx="497" cy="128" r="1.4" opacity="0.24"/>
    <circle cx="742" cy="66" r="1.0" opacity="0.18"/>
    <circle cx="988" cy="112" r="1.7" opacity="0.28"/>
    <circle cx="1216" cy="58" r="1.2" opacity="0.22"/>
    <circle cx="1421" cy="140" r="1.5" opacity="0.26"/>
    <circle cx="1534" cy="72" r="1.0" opacity="0.18"/>
    <circle cx="76" cy="812" r="1.3" opacity="0.22"/>
    <circle cx="332" cy="856" r="1.0" opacity="0.16"/>
    <circle cx="676" cy="828" r="1.5" opacity="0.24"/>
    <circle cx="1042" cy="866" r="1.1" opacity="0.18"/>
    <circle cx="1378" cy="820" r="1.4" opacity="0.24"/>
    <circle cx="1552" cy="864" r="1.0" opacity="0.16"/>
  </g>

  <!-- ══════════ SOL: kaba giriş ızgarası ══════════
       Dört büyük piksel. Yıldız tek pikselin içine sıkışmış — yetersiz
       örneklemenin görünüşü budur: konum bilgisi piksel içinde kayıp. -->
  <g transform="translate(148 268)">
    <rect x="0" y="0" width="366" height="366" fill="none" stroke="rgba(230,235,232,0.28)" stroke-width="2"/>
    <path d="M183 0 V366 M0 183 H366" stroke="rgba(230,235,232,0.20)" stroke-width="2"/>

    <rect x="185" y="2" width="179" height="179" fill="#ff9d2e" opacity="0.13"/>
    <circle cx="274" cy="92" r="96" fill="url(#dz-yildiz-kaba)"/>
    <circle cx="274" cy="92" r="7" fill="#ff9d2e" opacity="0.85"/>
  </g>

  <!-- ══════════ ORTA: küçültülmüş damlalar (pixfrac) ══════════
       Her damla bir pozun katkısı. Kenar uzunluğu pixfrac ile küçültülmüş
       kareler; her biri farklı bir alt piksel konumuna düşüyor — dither
       tam olarak bunu yapıyor. -->
  <g>
    <path d="M556 300 V452" stroke="url(#dz-iz)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M628 262 V480" stroke="url(#dz-iz)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M700 288 V428" stroke="url(#dz-iz)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M772 250 V492" stroke="url(#dz-iz)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M844 296 V444" stroke="url(#dz-iz)" stroke-width="2.5" stroke-linecap="round"/>

    <g fill="#ff9d2e">
      <rect x="536" y="470" width="40" height="40" opacity="0.75" transform="rotate(45 556 490)"/>
      <rect x="610" y="500" width="36" height="36" opacity="0.62" transform="rotate(45 628 518)"/>
      <rect x="682" y="446" width="36" height="36" opacity="0.80" transform="rotate(45 700 464)"/>
      <rect x="754" y="512" width="34" height="34" opacity="0.58" transform="rotate(45 771 529)"/>
      <rect x="826" y="462" width="38" height="38" opacity="0.70" transform="rotate(45 845 481)"/>
    </g>

    <!-- Küçültme oranını gösteren ölçek: dolu kare, kesikli tam piksel
         çerçevesinin içinde durur. pixfrac'in ne demek olduğu budur. -->
    <g transform="translate(596 604)">
      <rect x="0" y="0" width="84" height="84" fill="none" stroke="rgba(230,235,232,0.30)" stroke-width="2" stroke-dasharray="7 6"/>
      <rect x="21" y="21" width="42" height="42" fill="#ff9d2e" opacity="0.55"/>
    </g>
    <g transform="translate(736 604)">
      <rect x="0" y="0" width="84" height="84" fill="none" stroke="rgba(230,235,232,0.30)" stroke-width="2" stroke-dasharray="7 6"/>
      <rect x="12" y="12" width="60" height="60" fill="#ff9d2e" opacity="0.38"/>
    </g>
  </g>

  <!-- Akış yönü: sol ızgaradan sağ ızgaraya. -->
  <path d="M888 450 H916" stroke="rgba(230,235,232,0.35)" stroke-width="2"/>
  <path d="M916 450 l-11 -7 v14 z" fill="rgba(230,235,232,0.35)"/>

  <!-- ══════════ SAĞ: ince çıktı ızgarası ══════════
       Aynı alan, dört kat daha ince örgü. Yıldız artık tek bir piksele
       sıkışmıyor; damlaların biriktiği yerde konumu geri geliyor. -->
  <g transform="translate(950 245)">
    <rect x="0" y="0" width="410" height="410" fill="none" stroke="rgba(230,235,232,0.28)" stroke-width="2"/>
    <g stroke="rgba(230,235,232,0.13)" stroke-width="1.5">
      <path d="M51 0 V410 M102 0 V410 M153 0 V410 M205 0 V410 M256 0 V410 M307 0 V410 M358 0 V410"/>
      <path d="M0 51 H410 M0 102 H410 M0 153 H410 M0 205 H410 M0 256 H410 M0 307 H410 M0 358 H410"/>
    </g>

    <!-- Yıldızın çekirdeği: birkaç ince pikselde yoğunlaşıyor. -->
    <g fill="#ff9d2e">
      <rect x="205" y="102" width="51" height="51" opacity="0.85"/>
      <rect x="256" y="102" width="51" height="51" opacity="0.42"/>
      <rect x="205" y="153" width="51" height="51" opacity="0.46"/>
      <rect x="154" y="102" width="51" height="51" opacity="0.26"/>
      <rect x="205" y="51" width="51" height="51" opacity="0.24"/>
      <rect x="256" y="153" width="51" height="51" opacity="0.16"/>
    </g>
    <circle cx="240" cy="140" r="120" fill="url(#dz-yildiz)"/>
    <circle cx="231" cy="128" r="5" fill="#fff3e2"/>
  </g>

  <!-- Alt kenarda ince bir kehribar çizgi: kart kırpıldığında bile
       görselin sitenin paletine ait olduğunu taşıyan tek işaret. -->
  <rect x="0" y="894" width="1600" height="6" fill="#ff9d2e" opacity="0.55"/>
</svg>
