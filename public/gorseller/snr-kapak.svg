<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="snr-kapak-baslik">
  <title id="snr-kapak-baslik">Sinyal–gürültü oranının şeması: tek karede gürültüye gömülü obje, kare sayısı arttıkça ortaya çıkıyor; altta karekök eğrisi</title>

  <!--
    SNR KAPAK GÖRSELİ.

    Yazının tek cümlelik özeti şu: sinyal süreyle doğru, gürültü sürenin
    karekörüyle büyür, dolayısıyla iyileşme gittikçe pahalılaşır. Kapak
    bunu iki katmanda anlatıyor:

      üst  → aynı obje üç kez: 1 kare, 16 kare, 100 kare. Gürültü noktaları
             seyreliyor, obje ortaya çıkıyor.
      alt  → SNR eğrisi. İlk saatlerde dik, sonra yatıyor; üç panelin
             yeri eğrinin üstünde işaretli.

    Neden çizim, neden fotoğraf değil: `features/articles/data.ts` kart
    görselinin "yazının ne hakkında olduğunu bir bakışta söylemesi"
    gerektiğini yazıyor. Temiz bir bulutsu fotoğrafı burada tam tersini
    söylerdi — yazı zaten o fotoğrafa ulaşmanın neden pahalı olduğunu
    anlatıyor.

    GÜRÜLTÜ NOKTALARI ELLE YERLEŞTİRİLDİ ama sayıları keyfî değil:
    42 → 21 → 9, yani kabaca 1/√N. Görsel de makalenin kuralına uyuyor.
    Nokta boyutu ve saydamlığı da aynı oranda düşüyor.

    SABİT KOYU ZEMİN, tema değişkeni DEĞİL: dosya `public/` altından
    statik servis ediliyor ve sayfanın CSS değişkenlerini göremez. Aynı
    karar drizzle kapağında da verildi.
  -->

  <defs>
    <linearGradient id="sn-zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1114"/>
      <stop offset="0.55" stop-color="#0a0e11"/>
      <stop offset="1" stop-color="#07090b"/>
    </linearGradient>

    <radialGradient id="sn-obje" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9d2e" stop-opacity="0.92"/>
      <stop offset="0.38" stop-color="#ff9d2e" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="sn-pano-1"><rect x="112" y="118" width="340" height="300"/></clipPath>
    <clipPath id="sn-pano-2"><rect x="630" y="118" width="340" height="300"/></clipPath>
    <clipPath id="sn-pano-3"><rect x="1148" y="118" width="340" height="300"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#sn-zemin)"/>

  <!-- ══════════ PANEL 1 — tek kare ══════════ -->
  <g clip-path="url(#sn-pano-1)">
    <rect x="112" y="118" width="340" height="300" fill="#0b0e10"/>
    <circle cx="282" cy="268" r="118" fill="url(#sn-obje)" opacity="0.32"/>
    <g fill="#c9d3d0" opacity="0.62">
      <circle cx="146" cy="152" r="2.4"/><circle cx="207" cy="139" r="2.1"/><circle cx="268" cy="167" r="2.6"/>
      <circle cx="331" cy="141" r="2.2"/><circle cx="395" cy="163" r="2.5"/><circle cx="429" cy="196" r="2.3"/>
      <circle cx="131" cy="205" r="2.2"/><circle cx="189" cy="219" r="2.7"/><circle cx="253" cy="201" r="2.1"/>
      <circle cx="318" cy="228" r="2.5"/><circle cx="383" cy="209" r="2.2"/><circle cx="437" cy="243" r="2.6"/>
      <circle cx="124" cy="263" r="2.5"/><circle cx="176" cy="281" r="2.2"/><circle cx="241" cy="256" r="2.7"/>
      <circle cx="305" cy="287" r="2.3"/><circle cx="368" cy="262" r="2.4"/><circle cx="424" cy="296" r="2.2"/>
      <circle cx="139" cy="322" r="2.6"/><circle cx="198" cy="341" r="2.3"/><circle cx="262" cy="316" r="2.5"/>
      <circle cx="327" cy="349" r="2.1"/><circle cx="391" cy="324" r="2.7"/><circle cx="441" cy="356" r="2.4"/>
      <circle cx="152" cy="381" r="2.2"/><circle cx="215" cy="399" r="2.6"/><circle cx="279" cy="374" r="2.3"/>
      <circle cx="344" cy="404" r="2.5"/><circle cx="408" cy="383" r="2.2"/><circle cx="129" cy="411" r="2.4"/>
      <circle cx="236" cy="128" r="2.3"/><circle cx="360" cy="132" r="2.5"/><circle cx="169" cy="246" r="2.2"/>
      <circle cx="291" cy="221" r="2.6"/><circle cx="412" cy="271" r="2.3"/><circle cx="221" cy="303" r="2.4"/>
      <circle cx="352" cy="291" r="2.2"/><circle cx="184" cy="358" r="2.6"/><circle cx="300" cy="341" r="2.3"/>
      <circle cx="376" cy="411" r="2.5"/><circle cx="248" cy="411" r="2.2"/><circle cx="443" cy="141" r="2.4"/>
    </g>
  </g>
  <rect x="112" y="118" width="340" height="300" fill="none" stroke="rgba(230,235,232,0.22)" stroke-width="2"/>

  <!-- ══════════ PANEL 2 — 16 kare ══════════ -->
  <g clip-path="url(#sn-pano-2)">
    <rect x="630" y="118" width="340" height="300" fill="#0b0e10"/>
    <circle cx="800" cy="268" r="118" fill="url(#sn-obje)" opacity="0.78"/>
    <g fill="#c9d3d0" opacity="0.4">
      <circle cx="664" cy="151" r="1.9"/><circle cx="757" cy="171" r="1.7"/><circle cx="849" cy="145" r="2"/>
      <circle cx="941" cy="192" r="1.8"/><circle cx="681" cy="228" r="1.9"/><circle cx="774" cy="211" r="1.7"/>
      <circle cx="867" cy="239" r="2"/><circle cx="953" cy="262" r="1.8"/><circle cx="649" cy="291" r="1.9"/>
      <circle cx="742" cy="277" r="1.7"/><circle cx="835" cy="303" r="2"/><circle cx="927" cy="284" r="1.8"/>
      <circle cx="668" cy="347" r="1.9"/><circle cx="761" cy="368" r="1.7"/><circle cx="854" cy="341" r="2"/>
      <circle cx="946" cy="379" r="1.8"/><circle cx="700" cy="404" r="1.9"/><circle cx="893" cy="411" r="1.7"/>
      <circle cx="812" cy="133" r="1.8"/><circle cx="708" cy="253" r="1.9"/><circle cx="905" cy="329" r="1.7"/>
    </g>
  </g>
  <rect x="630" y="118" width="340" height="300" fill="none" stroke="rgba(230,235,232,0.22)" stroke-width="2"/>

  <!-- ══════════ PANEL 3 — 100 kare ══════════ -->
  <g clip-path="url(#sn-pano-3)">
    <rect x="1148" y="118" width="340" height="300" fill="#0b0e10"/>
    <circle cx="1318" cy="268" r="118" fill="url(#sn-obje)"/>
    <circle cx="1318" cy="268" r="46" fill="#ff9d2e" opacity="0.22"/>
    <circle cx="1318" cy="268" r="7" fill="#fff3e2"/>
    <g fill="#c9d3d0" opacity="0.22">
      <circle cx="1186" cy="163" r="1.5"/><circle cx="1300" cy="146" r="1.4"/><circle cx="1416" cy="188" r="1.5"/>
      <circle cx="1218" cy="256" r="1.4"/><circle cx="1451" cy="271" r="1.5"/><circle cx="1174" cy="341" r="1.4"/>
      <circle cx="1288" cy="378" r="1.5"/><circle cx="1402" cy="352" r="1.4"/><circle cx="1345" cy="404" r="1.5"/>
    </g>
  </g>
  <rect x="1148" y="118" width="340" height="300" fill="none" stroke="rgba(230,235,232,0.22)" stroke-width="2"/>

  <!-- ══════════ ALT: SNR eğrisi ══════════
       Eğri gerçek bağıntıdan: SNR ∝ √T. Üç panelin yeri 1, 16 ve 100
       karede işaretli — üstteki gürültü seyrelmesiyle aynı oranlar. -->
  <g>
    <path d="M150 800 H1470" stroke="rgba(230,235,232,0.22)" stroke-width="2"/>
    <path d="M150 800 V545" stroke="rgba(230,235,232,0.22)" stroke-width="2"/>

    <path
      d="M150 800 C 320 640, 520 592, 750 570 S 1180 545, 1470 538"
      fill="none" stroke="#ff9d2e" stroke-width="4" stroke-linecap="round"/>

    <g fill="rgba(230,235,232,0.30)">
      <circle cx="282" cy="694" r="9"/>
      <circle cx="800" cy="567" r="9"/>
      <circle cx="1318" cy="541" r="9"/>
    </g>
    <g fill="#0a0e11" stroke="#ff9d2e" stroke-width="3">
      <circle cx="282" cy="694" r="11"/>
      <circle cx="800" cy="567" r="11"/>
      <circle cx="1318" cy="541" r="11"/>
    </g>

    <!-- Panelleri eğriye bağlayan ince dikmeler. -->
    <g stroke="rgba(255,157,46,0.28)" stroke-width="2" stroke-dasharray="6 8">
      <path d="M282 428 V683"/>
      <path d="M800 428 V556"/>
      <path d="M1318 428 V530"/>
    </g>
  </g>

  <!-- Alt kenarda ince kehribar çizgi — drizzle kapağıyla aynı imza. -->
  <rect x="0" y="894" width="1600" height="6" fill="#ff9d2e" opacity="0.55"/>
</svg>
