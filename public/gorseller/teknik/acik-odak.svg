    <path d="M110 260h570" stroke="#f59e0b"/>
    <path d="M110 385C330 385 520 385 680 260" stroke="#f59e0b"/>
    <path d="M700 260c150 0 250 0 390 0" stroke="#67e8f9" stroke-dasharray="10 14"/>
