  <line x1="430" y1="90" x2="430" y2="430" stroke="#e2e8f0" stroke-width="3"/>
  <line x1="430" y1="450" x2="680" y2="450" stroke="#f59e0b" stroke-width="3"/>
  <line x1="110" y1="455" x2="430" y2="455" stroke="#94a3b8" stroke-width="3"/>
  <path d="M110 455h320M430 450h250" stroke-linecap="round"/>
  <circle cx="680" cy="260" r="10" fill="#f97316"/>
  <rect x="700" y="105" width="18" height="310" rx="9" fill="#94a3b8"/>
  <text x="110" y="86" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Paralel ışın</text>
  <text x="455" y="80" fill="#e0f2fe" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Açıklık</text>
  <text x="514" y="486" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Odak uzaklığı</text>
  <text x="736" y="96" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Sensör düzlemi</text>
