<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Açıklık ve odak uzaklığı şeması</title>
  <desc id="desc">Açıklıktan geçen paralel ışınların odak düzleminde birleşmesini gösteren optik şema.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#071014"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#e0f2fe" stop-opacity=".3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".85"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <g opacity=".45" stroke="#334155" stroke-width="1">
    <path d="M80 110h1040M80 260h1040M80 410h1040"/>
    <path d="M180 70v380M360 70v380M540 70v380M720 70v380M900 70v380"/>
  </g>
  <g stroke-linecap="round" stroke-width="4">
