    <text x="610" y="-28" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">Kısa odak</text>
    <g opacity=".35" stroke="#475569">
      <path d="M52 20v230M104 20v230M156 20v230M208 20v230M260 20v230M312 20v230M364 20v230"/>
