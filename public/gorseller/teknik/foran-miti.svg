<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">F-oranı miti şeması</title>
  <desc id="desc">Aynı açıklıkta odak kısaldığında toplam fotonun değişmediğini, sinyalin daha az piksele yayıldığını gösterir.</desc>
  <rect width="1200" height="520" rx="28" fill="#0a1014"/>
