<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050a12" />
    <meta
      name="description"
      content="Astrohub — Türkiye'nin astronomi, astrofotoğrafçılık, gözlem etkinlikleri, karanlık gökyüzü ve astrocamping platformu."
    />
    <title>Astrohub — Gökyüzünü keşfet, paylaş, öğren</title>

    <!--
      Tema, React yüklenmeden önce uygulanır; aksi hâlde açık tema seçen
      kullanıcı ilk boyamada koyu ekran görüp "flash" yaşar (§19.7).
      Kaynak sırası: kullanıcı seçimi → işletim sistemi tercihi → koyu.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('astrohub:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
          if (theme === 'light') {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#f6f8fc');
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
