name: CI

on:
  # ÖNCEDEN HER DALDA KOŞUYORDU (`branches: ['**']`) ve bu, aynı commit'i
  # hem çalışma dalına hem main'e gönderen bir akışta işi İKİYE
  # katlıyordu: iki koşu × iki iş = dört runner işi, her biri Chromium
  # indiren. Actions dakikası tam olarak böyle tükendi (10 Ağu).
  #
  # Kapı artık main'de ve pull request'te: kod yayın dalına girerken
  # denetleniyor, ara push'lar dakika yakmıyor. Çalışma dalını denetlemek
  # isteyen `workflow_dispatch` ile elle başlatabilir.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'astrohub-plan/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'astrohub-plan/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  # Aynı dala arka arkaya push edildiğinde eski koşuyu iptal et; sonucunu
  # zaten kimse beklemiyor ve runner dakikası boşa gidiyor.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Vercel rewrite listesi
        run: npm run check:rewrites

      - name: Playwright tarayıcı önbelleği
        id: pw-cache
        uses: actions/cache@v4
        with:
          # Tarayıcı ikilisi ~130 MB ve her koşuda yeniden iniyordu.
          # Anahtar kilit dosyasına bağlı: Playwright sürümü değişmedikçe
          # önbellek geçerli.
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: CSP denetimi
        run: npm run check:csp

      # Performans bütçesi kalite kapısıdır: burada, merge'den ÖNCE
      # denetlenir. Bilerek `npm run build` zincirinde DEĞİL — bir boyut
      # gerilemesi üretim dağıtımını bloke etmemeli; kapının işi kötü
      # değişikliği main'e sokmamak.
      - name: İlk yükleme bütçesi
        run: npm run check:budgets

  preview:
    # Önizleme derlemesi (tek dosya, gömülü varlıklar) üretim derlemesinden
    # farklı bir yoldan geçer; ona özgü hatalar birim testlerinde görünmez.
    # Bu iş, derlenen dosyayı gerçek bir tarayıcıda açıp uygulamanın
    # boyandığını ve tüm modüllerin gezilebildiğini doğrular.
    name: Önizleme duman testi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Playwright tarayıcı önbelleği
        id: pw-cache
        uses: actions/cache@v4
        with:
          # Tarayıcı ikilisi ~130 MB ve her koşuda yeniden iniyordu.
          # Anahtar kilit dosyasına bağlı: Playwright sürümü değişmedikçe
          # önbellek geçerli.
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build preview
        run: npm run build:preview

      - name: Check preview renders
        run: npm run check:preview

      # E2E, Vercel'in build adımında KOŞMUYOR; orada yalnızca `npm run
      # build` var. Bozuk bir akış (ölü düğme, kırılan rota) derlenip
      # yayına çıkabiliyordu. Yayın dalına giren her değişiklik artık
      # yirmi beş senaryodan geçiyor.
      # Erişilebilirlik kapısı: dokunma hedefleri ve ikon kontrollerinin
      # adları gerçek tarayıcıda ölçülür. Sınıf adından çıkarım yapmak
      # yanıltıcıydı — son ölçü padding ve kabın yüksekliğinden çıkıyor.
      - name: Erişilebilirlik denetimi
        run: npm run check:a11y

      - name: Viewport denetimi
        run: npm run check:viewports

      - name: E2E senaryoları
        run: node scripts/e2e.mjs

      # Düşen bir senaryonun sebebini görmek için: hangi ekranda ne
      # göründüğü, hata metninden daha hızlı anlatıyor.
      - name: Ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ekranlar
          path: dist-preview/screens/
          retention-days: 7
          if-no-files-found: ignore
